- name: claude-scientific-writer
  kind: vendored
  upstream: claude-scientific-writer
  category: communication
  description: "K-Dense's scientific writing toolkit (papers, grants, posters, clinical\
    \ reports, document conversion) plus a /scientific-writer-init command. NOTE:\
    \ this is a BUNDLE \u2014 its skills also ship in the focused sci-* and kdense-*\
    \ plugins. To avoid duplicate skills, install EITHER claude-scientific-writer\
    \ OR the focused plugins, not both."
- name: caveman
  kind: vendored-whole
  upstream: caveman
  category: productivity
  patched: true
  description: 'Caveman: ultra-compressed communication mode (lite/full/ultra/wenyan).
    Cuts ~75% of output tokens while keeping technical accuracy. Downstream-patched
    so terseness reads as value-proportional allocation: a floor for low-value turns,
    not a cap on high-value ones (see patches/caveman.json).'
- name: laconic
  kind: local
  category: productivity
  description: 'Laconic: a value-proportional communication register engine. Ships
    the ''laconic'' register: elliptical but literate, a sharp colleague writing fast.
    Drop the function words a reader restores for free, keep the logic connectives,
    notebook symbols where they decode. Compresses the report, never the work behind
    it. Registers are data files under registers/; drop in a new one to add a voice,
    no code change.'
