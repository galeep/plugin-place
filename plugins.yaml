# plugin-place: marketplace manifest source-of-truth
#
# The build script reads this file and generates:
#   - .claude-plugin/marketplace.json
#   - plugins/<name>/.claude-plugin/plugin.json  (for every `kind: built` plugin)
#   - plugins/<name>/skills/*                    (copied from the upstream submodule)
#
# Plugin kinds:
#   built:    skills copied in from an upstream submodule per the `skills:` list
#   vendored: an upstream submodule that is already a complete plugin; we point
#             marketplace.json at the submodule path directly
#   local:    a plugin authored in this repo (room to grow)

marketplace:
  name: plugin-place
  description: "Curated marketplace of Claude Code plugins. Built from upstream skill collections and direct plugin vendoring."
  version: "0.1.0"
  owner:
    name: galeep
  homepage: https://github.com/galeep/plugin-place

upstreams:
  scientific-agent-skills:
    submodule: vendor/scientific-agent-skills
    skills_root: skills
    pinned_tag: v2.45.0
    upstream_repo: K-Dense-AI/scientific-agent-skills
    license: MIT
  claude-scientific-writer:
    submodule: vendor/claude-scientific-writer
    pinned_tag: v2.13.0
    upstream_repo: K-Dense-AI/claude-scientific-writer
    license: MIT
  caveman:
    submodule: vendor/caveman
    pinned_tag: v1.8.2
    upstream_repo: JuliusBrussee/caveman
    license: MIT

