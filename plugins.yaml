- name: sci-bioinformatics-genomics
  kind: built
  upstream: scientific-agent-skills
  category: bioinformatics
  description: Sequence analysis, single-cell RNA-seq, gene regulatory networks, variant
    data, phylogenetics, and biomedical database lookup.
- name: sci-cheminformatics-drug-discovery
  kind: built
  upstream: scientific-agent-skills
  category: chemistry
