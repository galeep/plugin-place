- name: sci-agents-astronomy-space
  kind: agents
  upstream: scientific-agents
  category: physics
  description: 'Expert-thinking subagents for astronomy and space science: astrophysics,
    cosmology, planetary science, heliophysics, exoplanets, and astrodynamics.'
- name: sci-agents-earth-environment
  kind: agents
  upstream: scientific-agents
  category: earth-science
  description: 'Expert-thinking subagents for earth, environmental, ocean, and atmospheric
    science: geology, geophysics, climate, oceanography, hydrology, remote sensing,
