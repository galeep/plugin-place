  # ──────────────────────────────────────────────────────────────────────
  # Vendored intact plugin
  # ──────────────────────────────────────────────────────────────────────

  - name: claude-scientific-writer
    kind: vendored
    upstream: claude-scientific-writer
    category: communication
    description: "K-Dense's scientific writing toolkit: 23 skills (papers, grants, posters, clinical reports, paper-2-web) plus a /scientific-writer-init command. NOTE: 22 of these 23 skills also appear in sci-* plugins; only paper-2-web is unique to the writer. To avoid duplicate skills, install EITHER claude-scientific-writer OR the relevant sci-* plugins, not both."

  # ──────────────────────────────────────────────────────────────────────
  # Vendored-whole plugin with downstream patches
  #   Repo root is itself the plugin; hooks live in src/ and are wired by a
  #   custom plugin.json the generic `vendored` path would drop. `vendored-whole`
  #   preserves that manifest + src/, then applies patches/caveman.json.
  # ──────────────────────────────────────────────────────────────────────

  - name: caveman
    kind: vendored-whole
    upstream: caveman
    category: productivity
    # patched: true makes a missing patches/caveman.json a hard build error
    # rather than a silent unpatched publish.
    patched: true
    description: "Caveman: ultra-compressed communication mode (lite/full/ultra/wenyan). Cuts ~75% of output tokens while keeping technical accuracy. Downstream-patched so terseness reads as value-proportional allocation: a floor for low-value turns, not a cap on high-value ones (see patches/caveman.json)."

  # ──────────────────────────────────────────────────────────────────────
  # Local plugin — authored in-repo, never regenerated (kind: local).
  #   Files under plugins/laconic/ are the source of truth; render.py leaves
  #   them untouched (clean_built_plugins skips local) and just emits a
  #   marketplace entry pointing at them. No submodule, no patch layer.
  # ──────────────────────────────────────────────────────────────────────

  - name: laconic
    kind: local
    category: productivity
    description: "Laconic: a value-proportional communication register engine. Ships the 'laconic' register: elliptical but literate, a sharp colleague writing fast. Drop the function words a reader restores for free, keep the logic connectives, notebook symbols where they decode. Compresses the report, never the work behind it. Registers are data files under registers/; drop in a new one to add a voice, no code change."
