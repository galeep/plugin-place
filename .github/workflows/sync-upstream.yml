name: Sync upstream releases

# Daily cron + manual trigger. Checks each upstream submodule for a newer
# release tag than the one currently pinned in plugins.yaml. When a newer
# tag is found, it: bumps the submodule, rebuilds the plugins, runs
# validation, and opens a PR with the diff for human review.

on:
  schedule:
    - cron: "17 9 * * *"  # 09:17 UTC daily, offset to avoid the top-of-hour rush
  workflow_dispatch: {}

# A manual dispatch fired while the cron is mid-run would race it: two runs
# checking the same upstream, both passing the dedupe gate below (neither has
# opened its PR yet), producing the duplicate that gate exists to prevent.
# Queue instead of cancelling: a half-finished sync should complete rather than
# be killed partway through a submodule bump.
#
# Known cost, accepted deliberately: GitHub holds at most ONE pending run per
# group, and a third trigger arriving while one runs and one waits cancels the
# waiter. A cancelled run does not send a failure notification, so that day's
# sync would vanish quietly. Reaching it needs three overlapping triggers
# against a once-daily cron, so it takes deliberate manual dispatching; the
# timeout-minutes below caps how long a hung run can hold the lock and make it
# reachable at all. Prefixed with github.workflow so a future workflow reusing
# the literal name cannot contend for the same lock.
concurrency:
  group: ${{ github.workflow }}-sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # The default is 360 minutes. A run hung on a network step would hold the
    # concurrency lock that whole time, which is what makes the silent
    # cancellation described above reachable. This job is minutes of work.
    timeout-minutes: 20
    steps:
      - name: Check out marketplace repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          pip install pyyaml
          sudo apt-get update -qq
          sudo apt-get install -y jq

      - name: Check for upstream updates
        id: check
        run: |
          set -euo pipefail
          changed=0
          notes=""
          pins_changed=""
          # Tab-separated "<upstreams-key>\t<chosen-tag>" lines, one per upstream
          # this step actually advances. The bump step consumes this verbatim so
          # it writes the exact tag chosen here rather than re-deriving it.
          resolved=""

          # Enumerate upstreams once and capture to a variable. A bare process
          # substitution (done < <(python3 ...)) swallows a Python crash: the
          # loop reads nothing and the step exits 0, silently skipping every
          # sync check. Command-substitution assignment propagates the failure
          # under `set -e` so a broken enumerator fails the job loudly.
          # Columns: <upstreams-key>\t<submodule-path>\t<basename>\t<repo>\t<pinned_tag>.
          # Column 1 (key) is the upstreams dict key; the bump step keys its
          # lookup on it, so it must match exactly. Column 2 is the full
          # submodule path from plugins.yaml, used as the cd target so the
          # layout is not hardcoded to vendor/<basename>. Column 3 is the
          # basename, kept only for the human-facing pins_changed label.
          upstreams="$(python3 -c '
          import yaml
          c = yaml.safe_load(open("plugins.yaml"))
          for name, up in c["upstreams"].items():
              tag = up.get("pinned_tag")
              if not tag:
                  # SHA-pinned upstreams (no pinned_tag) are bumped manually, not
                  # by this tag-tracking cron. Skip them.
                  continue
              path = up["submodule"]
              sub = path.split("/")[-1]
              repo = up["upstream_repo"]
              print(f"{name}\t{path}\t{sub}\t{repo}\t{tag}")
          ')"

          # For each upstream in plugins.yaml, fetch tags and compare to pin.
          while IFS=$'\t' read -r key path sub repo current; do
            [ -n "$key" ] || continue
            echo "Checking $sub (currently @ $current)"
            cd "$path"
            git fetch --tags --quiet
            # Capture then take the first line via parameter expansion. A
            # `git tag ... | head -1` pipe trips `set -o pipefail` when head
            # closes the pipe early and git dies on SIGPIPE (exit 141) once the
            # tag list exceeds the pipe buffer. Command substitution keeps a
            # real git failure loud while avoiding the pipe entirely.
            tags=$(git tag -l 'v*' --sort=-v:refname)
            latest="${tags%%$'\n'*}"
            if [ -z "$latest" ]; then
              echo "  no v* tags found, skipping"
              cd "$GITHUB_WORKSPACE"
              continue
            fi
            if [ "$latest" = "$current" ]; then
              echo "  up to date"
            else
              echo "  $current -> $latest"
              git checkout "$latest" --quiet
              changed=1
              pins_changed="${pins_changed}${sub}: ${current} -> ${latest}\n"
              resolved="${resolved}${key}\t${latest}\n"
            fi
            cd "$GITHUB_WORKSPACE"
          done <<< "$upstreams"

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          # multiline output for the PR body
          {
            echo "pins_changed<<EOF"
            printf '%b' "$pins_changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # multiline output: the authoritative key->tag map the bump step reads
          {
            echo "resolved<<EOF"
            printf '%b' "$resolved"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bump pinned_tag values in plugins.yaml
        if: steps.check.outputs.changed == '1'
        env:
          # Passed through env (not interpolated into the script body) so tab/
          # newline-bearing content can't break or inject into the shell.
          RESOLVED_TAGS: ${{ steps.check.outputs.resolved }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, yaml
          from pathlib import Path

          # The check step already chose AND checked out the exact tag for every
          # submodule it advanced (git tag -l 'v*' --sort=-v:refname, first line).
          # Re-deriving here with `git describe --exact-match` is unsafe: when two
          # tags point at the same commit, describe prefers the annotated tag,
          # which need not equal the version-sorted tag the check step picked.
          # So consume the check step's decision verbatim. RESOLVED_TAGS is TSV
          # ("<upstreams-key>\t<tag>"), one line per upstream the check bumped.
          resolved = {}
          for line in os.environ.get("RESOLVED_TAGS", "").splitlines():
              if not line.strip():
                  continue
              key, _, tag = line.partition("\t")
              resolved[key] = tag

          p = Path("plugins.yaml")
          src = p.read_text()
          config = yaml.safe_load(src)

          for name, up in config["upstreams"].items():
              new_tag = resolved.get(name)
              if not new_tag:
                  # Not advanced by the check step (includes SHA-pinned upstreams
                  # the check step skips). Keep the existing pin. Logged so a
                  # skipped upstream is visible rather than silently absent.
                  print(f"  {name}: not bumped by check step, keeping pin")
                  continue
              old_tag = up.get("pinned_tag")
              if old_tag and old_tag != new_tag:
                  # Replace via string substitution to preserve formatting
                  needle = f'pinned_tag: {old_tag}'
                  replacement = f'pinned_tag: {new_tag}'
                  if needle not in src:
                      raise SystemExit(f"could not find {needle!r} in plugins.yaml")
                  src = src.replace(needle, replacement, 1)
                  print(f"updated {name}: {old_tag} -> {new_tag}")

          p.write_text(src)
          PY

      - name: Record upstream license drift
        id: licenses
        if: steps.check.outputs.changed == '1'
        # Advisory, never fatal. An upstream relicense used to move through this
        # workflow silently: the review summary below counts
        # `plugins/<name>/LICENSE` as one anonymous increment to its
        # "asset/other" tally, so caveman's v2.1.0 MIT -> split MIT + BSL-1.1
        # change was indistinguishable from a README typo fix.
        #
        # Deliberately NOT the patch-anchor abort idiom: hard-failing on a
        # license edit would suppress that day's sync PR entirely, trading a
        # silent relicense for a silent sync outage — the worse failure for a
        # workflow whose whole job is telling a human that third-party code
        # moved. So the report is routed into the PR body instead, where the
        # human gate already reads. A warning that only lands in a green cron's
        # log is unobservable, the same trap the dedupe gate documents below.
        #
        # --check runs BEFORE --write: the report must describe drift against
        # the reviewed pin, and --write would erase that comparison.
        run: |
          set -euo pipefail
          {
            echo "report<<LICENSE_EOF"
            python3 scripts/license-fingerprint.py --check
            echo "LICENSE_EOF"
          } >> "$GITHUB_OUTPUT"
          # Record the new fingerprints so the PR carries them and merging
          # returns the repo to a clean state; the plugins.yaml diff shows the
          # change alongside the report above.
          python3 scripts/license-fingerprint.py --write

      - name: Rebuild plugins
        if: steps.check.outputs.changed == '1'
        run: bash scripts/build.sh

      - name: Validate every plugin
        if: steps.check.outputs.changed == '1'
        run: |
          set -euo pipefail
          fails=0
          for d in plugins/*/; do
            if ! bash scripts/validate-plugin.sh "$d" >/dev/null 2>&1; then
              echo "FAIL: $(basename "$d")"
              bash scripts/validate-plugin.sh "$d" || true
              fails=$((fails + 1))
            fi
          done
          if [ "$fails" -gt 0 ]; then
            echo "::error::$fails plugin(s) failed validation"
            exit 1
          fi

      - name: Smoke-test patched caveman hook
        if: steps.check.outputs.changed == '1'
        # Proves the patched per-turn hook still EMITS the allocation framing at
        # runtime, not merely that the patch anchor matched. Catches an upstream
        # bump that keeps the anchor but breaks the hook (the silent-injection
        # failure the patch anchor check cannot see).
        run: bash scripts/smoke-caveman.sh

      - name: Build review summary
        id: summary
        if: steps.check.outputs.changed == '1'
        run: |
          set -euo pipefail
          # Stage the regenerated tree so added/removed files show in the diff
          # (create-pull-request re-stages later; this -A is harmless).
          git add -A
          # Categorize the staged diff for the human gate: skills added/removed,
          # any that look reassigned to a different plugin, and where the file
          # weight sits. A python failure aborts the step under `set -e`.
          python3 <<'PY'
          import collections, glob, os, re, subprocess

          diff = subprocess.run(
              ["git", "diff", "--cached", "--name-status", "--no-renames", "HEAD"],
              text=True, capture_output=True, check=True,
          ).stdout
          # SKILL.md sits one level under a plugin's skills/ dir by convention
          # (every current skill); a deeper layout would slip past this regex.
          skill_re = re.compile(r"^plugins/([^/]+)/skills/([^/]+)/SKILL\.md$")
          added, removed, modified = [], [], []
          cat = collections.Counter()
          total = 0
          for line in diff.splitlines():
              if not line.strip():
                  continue
              fields = line.split("\t")
              status, path = fields[0], fields[-1]
              total += 1
              m = skill_re.match(path)
              if m:
                  entry = (m.group(1), m.group(2))
                  cat["content"] += 1
                  bucket = (added if status.startswith("A")
                            else removed if status.startswith("D")
                            else modified)
                  bucket.append(entry)
              elif (re.match(r"^plugins/[^/]+/README\.md$", path)
                    or path == "plugins.yaml"
                    or path == ".claude-plugin/marketplace.json"
                    or path == ".claude-plugin/provenance.json"
                    or path.endswith("/.claude-plugin/plugin.json")
                    or path.startswith("vendor/")):
                  # Generated/boilerplate: pins, provenance, marketplace +
                  # per-plugin manifests, plugin-level READMEs, submodule pointer.
                  cat["mechanical"] += 1
              else:
                  # Skill-internal READMEs, references, and assets land here.
                  cat["asset"] += 1

          added_by = collections.defaultdict(set)
          removed_by = collections.defaultdict(set)
          for plugin, skill in added:
              added_by[skill].add(plugin)
          for plugin, skill in removed:
              removed_by[skill].add(plugin)
          # A skill name appearing as both an add (one plugin) and a remove
          # (another) is a likely reassignment the gate must eyeball.
          moves = sorted(set(added_by) & set(removed_by))

          def fmt(items):
              return ", ".join(f"`{s}` ({p})" for p, s in sorted(items)) if items else "none"

          out = [
              f"**Skills added ({len(added)}):** {fmt(added)}",
              f"**Skills removed ({len(removed)}):** {fmt(removed)}",
          ]
          if moves:
              mv = "; ".join(
                  f"`{s}`: {', '.join(sorted(removed_by[s]))} to {', '.join(sorted(added_by[s]))}"
                  for s in moves
              )
              out.append(f"**⚠ Possible plugin reassignment:** {mv}")
          else:
              out.append("**Possible plugin reassignment:** none")
          # Which ADDED skills already have a home in another plugin. Overlap is
          # normal here (the writer overlaps sci-* by design, ~20 cases), so this
          # is not a gate — but a NEW overlap must be named rather than folded
          # into an anonymous "+N skills" line. Writer v2.21.0 is the motivating
          # case: it flattened document-skills/ to top level, so the writer began
          # shipping docx/pdf/pptx/xlsx, which kdense-document-skills owns. The
          # build did not fail and the old summary would have said only
          # "Skills added (4)".
          owners = collections.defaultdict(set)
          for skills_dir in sorted(glob.glob("plugins/*/skills/*/SKILL.md")):
              parts = skills_dir.split("/")
              owners[parts[3]].add(parts[1])
          new_overlaps = sorted(
              (skill, plugin, sorted(owners[skill] - {plugin}))
              for plugin, skill in added
              if len(owners.get(skill, ())) > 1
          )
          if new_overlaps:
              out.append(
                  "**\u26a0 Added skills that already exist elsewhere:** "
                  + "; ".join(
                      f"`{s}` into {p} (also in {', '.join(o)})"
                      for s, p, o in new_overlaps
                  )
                  + " \u2014 confirm which plugin should own each before merging."
              )
          out.append(f"**Skills modified:** {len(modified)}")
          out.append(
              f"**File breakdown:** {cat['mechanical']} mechanical, "
              f"{cat['content']} skill-content, {cat['asset']} asset/other "
              f"({total} files total)"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("review<<REVIEW_EOF\n")
              fh.write("\n".join(out) + "\n")
              fh.write("REVIEW_EOF\n")
          PY

      - name: Skip if an identical sync proposal is already open
        id: dedupe
        if: steps.check.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # NOTE: deliberately no `set -e`. Every failure below is handled
          # explicitly so the FAIL DIRECTION is a decision rather than an
          # accident. See the fail-open rationale further down.
          set -uo pipefail

          # DESIGN RATIONALE: the check step compares upstream against the pin on
          # the CHECKED-OUT ref, not against what is already proposed. So while a
          # sync PR sits unmerged, the ref stays stale, every subsequent run
          # re-detects the same gap, and opens another PR for a bump already
          # awaiting review. That is how #33-#49 accumulated: 17 PRs carrying
          # 2 distinct upstream pins.
          #
          # Volume is the real cost, not tidiness. Each sync PR is a human gate
          # on third-party code that CI will execute once approved, and a gate is
          # worth exactly the review behind each click. A queue nobody can read
          # in full degrades into a rubber stamp, so suppressing duplicates is a
          # security property here, not housekeeping.
          #
          # Compares PIN SETS, not trees. A tree comparison is base-dependent:
          # any unrelated commit landing on main changes the regenerated tree, so
          # the gate would only match while main is frozen. The pin set is what
          # the proposal *is*, and survives base drift.
          #
          # FAIL DIRECTION: every error path below opens the PR (fail-open) and
          # says why. A duplicate PR is noise; a suppressed one is a sync that
          # silently never happened, and this workflow's whole job is telling a
          # human that third-party code moved. Noise beats silence, so an
          # unusable gate must not become an invisible one.
          fail_open() {
            echo "::warning::dedupe: $1; opening the PR rather than risking a suppressed sync"
            echo "proceed=1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if ! pins_here="$(python3 scripts/sync-pins.py plugins.yaml)"; then
            fail_open "could not read local pins from plugins.yaml"
          fi
          echo "proposing pins:"; echo "$pins_here" | sed 's/^/  /'

          # --limit is load-bearing: gh pr list defaults to 30, and the backlog
          # this gate exists to prevent already reached 17. Sorted newest-first,
          # so silently dropping the tail would drop the oldest PR — the one most
          # likely to be the match.
          #
          # Selects on head-branch prefix rather than the upstream-sync label:
          # create-pull-request applies labels in a separate API call after the
          # PR exists, so a label failure would leave a real proposal invisible
          # here. It also catches a hand-rebased sync PR (e.g. #50), which
          # carried no labels at all. The branch name is set by this workflow.
          if ! open_prs="$(gh pr list --state open --limit 200 \
                             --json number,headRefName \
                             --jq '.[] | select(.headRefName | startswith("sync/upstream-")) | .number')"; then
            fail_open "gh pr list failed (auth, rate limit, or API error)"
          fi

          duplicate=""
          for pr in $open_prs; do
            # --no-recurse-submodules: fetch.recurseSubmodules defaults to
            # on-demand, so fetching a PR head whose gitlink is not present
            # locally would trigger a submodule fetch whose failure would fail
            # this comparison for an unrelated reason.
            if ! git fetch --quiet --no-recurse-submodules origin "refs/pull/$pr/head" 2>&1; then
              echo "::warning::dedupe: could not fetch refs/pull/$pr/head; not compared against #$pr"
              continue
            fi
            if ! pins_there="$(git show FETCH_HEAD:plugins.yaml 2>/dev/null | python3 scripts/sync-pins.py -)"; then
              echo "::warning::dedupe: could not read pins from #$pr; not compared against it"
              continue
            fi
            if [ "$pins_there" = "$pins_here" ]; then
              duplicate="$pr"
              break
            fi
          done

          if [ -n "$duplicate" ]; then
            echo "::notice::identical sync proposal already open as #${duplicate}; not opening a duplicate"
            # Job summary, not just the log. A suppression that only ever appears
            # in a green cron's log is unobservable in the GitHub UI, which is
            # the same "green means current" trap this workflow already risks.
            {
              echo "### Sync suppressed"
              echo
              echo "Identical pin set already proposed in #${duplicate}. No new PR opened."
              echo
              echo '```'
              echo "$pins_here"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "proceed=0" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.check.outputs.changed == '1' && steps.dedupe.outputs.proceed == '1'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: sync/upstream-${{ github.run_id }}
          delete-branch: true
          commit-message: "sync: bump upstream pins"
          title: "sync: upstream release update"
          body: |
            Automated sync from `.github/workflows/sync-upstream.yml`.

            ## Pin changes

            ```
            ${{ steps.check.outputs.pins_changed }}
            ```

            ## Review summary

            ${{ steps.summary.outputs.review }}

            ## License review

            ${{ steps.licenses.outputs.report }}

            ## What was regenerated

            All `plugins/sci-*` and `plugins/kdense-*` directories were
            rebuilt from the new submodule contents. The `vendored` plugin
            (`plugins/claude-scientific-writer`) was reseeded from the new
            writer submodule.

            ## Pre-merge checklist

            - [ ] Review skill additions/removals in the diff
            - [ ] Spot-check that no skill changed plugin assignment unexpectedly
            - [ ] Verify upstream release notes (linked above) don't include breaking changes
            - [ ] Read the License review section; if it reports drift, confirm the
                  terms still permit vendoring before merging
            - [ ] Validation passed (CI check below)
          labels: |
            upstream-sync
            automated
