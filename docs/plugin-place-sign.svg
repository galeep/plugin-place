<svg xmlns="http://www.w3.org/2000/svg" viewBox="117 55 967 300" role="img" aria-label="A green street blade sign reading PLUGIN PLACE">
  <title>Plugin Place</title>
  <desc>Hand-drawn vector by Claude (Anthropic) via galeep, for the plugin-place README. Lettering outlined from Helvetica Bold; MIT-licensed; no external image source.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
