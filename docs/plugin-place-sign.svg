        <dc:title>Plugin Place</dc:title>
        <dc:creator>Claude (Anthropic) via galeep</dc:creator>
        <dc:source>galeep/plugin-place</dc:source>
        <dc:date>2026-06-07</dc:date>
        <dc:rights>MIT</dc:rights>
        <dc:description>Original hand-drawn vector; lettering outlined from Helvetica Bold. No external image source.</dc:description>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a8049"/>
      <stop offset="1" stop-color="#005f31"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2c8cc"/>
      <stop offset="0.5" stop-color="#868d92"/>
      <stop offset="1" stop-color="#c2c8cc"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-25%" width="124%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- short galvanized U-channel stub (banner proportions) with punch holes + mounting cap -->
  <rect x="585" y="250" width="30" height="75" rx="6" fill="url(#pole)"/>
  <g fill="#5d6368">
    <ellipse cx="600" cy="283" rx="5" ry="8"/>
    <ellipse cx="600" cy="308" rx="5" ry="8"/>
  </g>
  <rect x="572" y="232" width="56" height="26" rx="5" fill="#7c8388"/>

  <!-- green blade with classic inset white border (hugs the legend) -->
  <g filter="url(#shadow)">
    <rect x="156.7" y="86" width="886.6" height="164" rx="14" fill="url(#blade)"/>
    <rect x="172.7" y="102" width="854.6" height="132" rx="8" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.92"/>
  </g>

